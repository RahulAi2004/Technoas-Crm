server {
  listen 80;
  server_name _;
  client_max_body_size 30m;        # image/file uploads base64 mein aate hain (24MB tak)

  # API + SSE → backend container
  location /api/ {
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection '';
    proxy_buffering off;            # required for SSE (/api/stream)
    proxy_cache off;
    proxy_read_timeout 3600s;
    chunked_transfer_encoding off;
  }

  # index.html KABHI cache na ho -> har deploy par naya bundle load hota hai.
  # (Vite ke hashed /assets/ files khud alag naam se aati hain, unhe cache karna theek hai.)
  location = /index.html {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # SPA static files
  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
  }
}
