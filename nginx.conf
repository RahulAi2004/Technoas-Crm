server {
  listen 80;
  server_name _;
  client_max_body_size 30m;        # image/file uploads base64 mein aate hain (24MB tak)
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  # API + SSE → backend container
  location /api/ {
    # A variable forces Nginx to re-resolve Docker DNS after the backend
    # container is recreated instead of keeping its old container IP forever.
    set $crm_backend backend;
    proxy_pass http://$crm_backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection '';
    proxy_buffering off;            # required for SSE (/api/stream)
    proxy_cache off;
    proxy_read_timeout 3600s;
    chunked_transfer_encoding off;
  }

  # Hashed assets (index-XXXX.js) — filename badalta hai, lambi cache safe
  location /assets/ {
    root /usr/share/nginx/html;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html + SPA — KABHI cache mat karo, taaki har deploy par naya bundle load ho
  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires -1;
  }
}
